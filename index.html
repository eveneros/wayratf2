<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEURO-AVIATOR · Deep Neuroevolution Training</title>
<style>
  :root{
    --bg:#05070d; --panel:rgba(10,16,28,.82); --border:rgba(80,200,255,.18);
    --accent:#22d3ee; --accent2:#a855f7; --text:#e6f1ff; --dim:#7a8ca3;
    --good:#22c55e; --warn:#f59e0b; --bad:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);
    font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:12px;
    -webkit-font-smoothing:antialiased}
  canvas{display:block}
  #c{position:fixed;inset:0;width:100%;height:100%}
  .hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  .hud>*{pointer-events:auto}
  .topbar{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);
    display:flex;gap:20px;padding:10px 22px;background:var(--panel);
    border:1px solid var(--border);border-radius:12px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.5)
  }
  .brand{font-weight:700;letter-spacing:2px;color:var(--accent);
    text-shadow:0 0 12px rgba(34,211,238,.6);font-size:13px}
  .stat{display:flex;flex-direction:column;gap:2px;min-width:60px}
  .stat .k{font-size:9px;letter-spacing:1.4px;color:var(--dim);text-transform:uppercase}
  .stat .v{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}

  .panel{position:absolute;background:var(--panel);border:1px solid var(--border);
    border-radius:12px;padding:14px;backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);box-shadow:0 10px 40px rgba(0,0,0,.55)}
  .panel h3{margin-bottom:10px;font-size:10px;letter-spacing:2px;color:var(--accent);
    text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:8px}

  #left-panel{top:80px;left:14px;width:230px}
  #right-panel{top:80px;right:14px;width:230px}
  #bottom-panel{bottom:14px;left:50%;transform:translateX(-50%);
    width:min(880px,calc(100vw - 28px));height:150px;display:flex;flex-direction:column}

  .row{display:flex;justify-content:space-between;padding:3px 0;font-size:11px}
  .row .l{color:var(--dim)}
  .row .r{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}

  .bar{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;margin:8px 0}
  .bar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));
    border-radius:3px;transition:width .3s ease}

  button{background:rgba(34,211,238,.08);border:1px solid var(--border);color:var(--text);
    padding:7px 10px;border-radius:6px;font-family:inherit;font-size:11px;
    cursor:pointer;transition:all .15s;letter-spacing:.4px}
  button:hover{background:rgba(34,211,238,.22);border-color:var(--accent)}
  button.primary{background:rgba(34,211,238,.18);border-color:var(--accent);color:#cffaff}
  button.danger{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.4);color:#fecaca}
  button.danger:hover{background:rgba(239,68,68,.25);border-color:var(--bad)}
  .btn-row{display:flex;gap:6px;margin-top:8px}
  .btn-row button{flex:1}

  select,input[type=range]{background:rgba(255,255,255,.05);border:1px solid var(--border);
    color:var(--text);padding:5px 8px;border-radius:5px;font-family:inherit;font-size:11px;width:100%}
  input[type=range]{padding:0;height:22px;accent-color:var(--accent);cursor:pointer}
  select:focus,input:focus{outline:1px solid var(--accent)}

  #chart-canvas{flex:1;width:100%;min-height:0}

  .toast{position:absolute;bottom:180px;left:50%;transform:translateX(-50%);
    padding:10px 18px;background:var(--panel);border:1px solid var(--accent);
    border-radius:8px;font-size:12px;opacity:0;transition:opacity .3s;
    pointer-events:none;box-shadow:0 0 24px rgba(34,211,238,.3)}
  .toast.show{opacity:1}
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud">
    <div class="topbar">
      <span class="brand">◆ NEURO-AVIATOR</span>
      <div class="stat"><span class="k">Gen</span><span class="v" id="s-gen">1</span></div>
      <div class="stat"><span class="k">Alive</span><span class="v" id="s-alive">0</span></div>
      <div class="stat"><span class="k">Best (km)</span><span class="v" id="s-best">0</span></div>
      <div class="stat"><span class="k">Level</span><span class="v" id="s-level">1</span></div>
      <div class="stat"><span class="k">Time</span><span class="v" id="s-time">00:00</span></div>
      <div class="stat"><span class="k">Goal</span><span class="v" id="s-goal">0%</span></div>
      <div class="stat"><span class="k">FPS</span><span class="v" id="s-fps">60</span></div>
    </div>

    <div id="left-panel" class="panel">
      <h3>Population Stats</h3>
      <div class="row"><span class="l">Avg Dist</span><span class="r" id="p-avg">0</span></div>
      <div class="row"><span class="l">Min Dist</span><span class="r" id="p-min">0</span></div>
      <div class="row"><span class="l">Max Dist</span><span class="r" id="p-max">0</span></div>
      <div class="row"><span class="l">Alive</span><span class="r" id="p-alive">0/0</span></div>
      <div class="row"><span class="l">Mutation</span><span class="r" id="p-mut">15%</span></div>
      <div class="bar"><div id="p-bar" style="width:0%"></div></div>
      <div class="row"><span class="l">Gen Best</span><span class="r" id="p-genbest">0 km</span></div>
      <div class="row"><span class="l">Global Best</span><span class="r" id="p-globalbest">0 km</span></div>
    </div>

    <div id="right-panel" class="panel">
      <h3>Controls</h3>
      <div class="btn-row">
        <button id="btn-pause" class="primary">⏸ Pause</button>
        <button id="btn-reset" class="danger">⟲ Reset</button>
      </div>
      <div style="margin-top:12px">
        <div class="row"><span class="l">Sim Speed</span><span class="r" id="v-speed">1×</span></div>
        <input type="range" id="in-speed" min="1" max="30" value="1" step="1">
      </div>
      <div style="margin-top:10px">
        <div class="row"><span class="l">Difficulty</span><span class="r" id="v-diff">Normal</span></div>
        <select id="in-diff">
          <option value="0.5">Easy</option>
          <option value="1" selected>Normal</option>
          <option value="1.6">Hard</option>
          <option value="2.5">Extreme</option>
        </select>
      </div>
      <div class="btn-row" style="margin-top:12px">
        <button id="btn-save">💾 Save Brain</button>
        <button id="btn-load">📁 Load</button>
      </div>
      <input type="file" id="file-in" style="display:none" accept=".json">
    </div>

    <div id="bottom-panel" class="panel">
      <h3>Evolution Progress</h3>
      <canvas id="chart-canvas"></canvas>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.139.2/build/three.min.js"></script>
  <script src="game-ai.js"></script>
</body>
</html>
